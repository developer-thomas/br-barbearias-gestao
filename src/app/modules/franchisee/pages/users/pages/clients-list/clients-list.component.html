<app-page-header [title]="title" [pageSession]="pageSession" />

<section>
  <app-filter-table (filter)="filter($event)">
    <!-- <app-base-button label="Novo cliente" routerLink="form"></app-base-button> -->
  </app-filter-table>

  <app-commom-table
    [data]="clients()"
    [displayedColumns]="displayedColumns"
    (detail)="gotoDetailPage($event)"
    (edit)="gotoEditPage($event)"
    (delete)="deleteClient($event)"
    [useEditBtn]="false"
  ></app-commom-table>
</section>
