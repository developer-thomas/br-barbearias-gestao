<app-page-header title="Detalhes do Banner" pageSession="Banners"></app-page-header>
<div class="min-h-screen bg-gray-50 p-6">
  <div class="max-w-6xl mx-auto">
    <ng-container *ngIf="banner() as bannerData; else loadingState">
      <!-- Banner Card -->
      <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
        <!-- Banner Image Section -->
        <div class="relative">
          <img
            [src]="bannerData.imageUrl"
            [alt]="bannerData.title"
            class="w-full h-96 object-cover"
          />

          <!-- Action Buttons Overlay -->
          <div class="absolute top-4 right-4 flex items-center gap-3">
            <button
              mat-icon-button
              class="bg-white bg-opacity-20 text-white hover:bg-opacity-30 backdrop-blur-sm"
              (click)="onDelete()"
            >
              <mat-icon>delete</mat-icon>
            </button>
            <button
              mat-icon-button
              class="bg-white bg-opacity-20 text-white hover:bg-opacity-30 backdrop-blur-sm"
              (click)="onEdit()"
            >
              <mat-icon>edit</mat-icon>
            </button>
            <mat-slide-toggle
              [checked]="bannerData.isActive"
              (change)="onToggleStatus()"
              color="primary"
              class="banner-toggle"
            ></mat-slide-toggle>
          </div>
        </div>

        <!-- Banner Details Section -->
        <div class="p-8">
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
            <!-- Title -->
            <div>
              <h3 class="text-sm font-semibold text-gray-500 mb-2">Título</h3>
              <p class="text-gray-900 font-medium">{{ bannerData.title }}</p>
            </div>

            <!-- Target Audience -->
            <div>
              <h3 class="text-sm font-semibold text-gray-500 mb-2">Para quem</h3>
              <p class="text-gray-900">{{ bannerData.target }}</p>
            </div>

            <!-- Start Date -->
            <div>
              <h3 class="text-sm font-semibold text-gray-500 mb-2">Data inicial</h3>
              <p class="text-gray-900">{{ bannerData.startDate }}</p>
            </div>

            <!-- End Date -->
            <div>
              <h3 class="text-sm font-semibold text-gray-500 mb-2">Data final</h3>
              <p class="text-gray-900">{{ bannerData.endDate }}</p>
            </div>

            <!-- Link -->
            <div>
              <h3 class="text-sm font-semibold text-gray-500 mb-2">Link</h3>
              <a
                [href]="bannerData.displayLink"
                target="_blank"
                rel="noopener"
                class="text-blue-600 hover:text-blue-800 underline"
              >
                {{ bannerData.link }}
              </a>
            </div>

            <!-- Location -->
            <div class="md:col-span-3">
              <h3 class="text-sm font-semibold text-gray-500 mb-2">Localizações</h3>
              <ul class="space-y-2">
                <li *ngFor="let location of bannerData.locations" class="text-gray-900">
                  {{ location }}
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </ng-container>

    <ng-template #loadingState>
      <div class="flex items-center justify-center py-24">
        <div class="text-gray-500" *ngIf="isLoading(); else errorState">Carregando detalhes do banner...</div>
      </div>
    </ng-template>

    <ng-template #errorState>
      <div class="text-red-500">Não foi possível carregar os detalhes do banner.</div>
    </ng-template>
  </div>
</div>
