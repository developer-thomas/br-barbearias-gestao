<app-page-header title="Detalhes do Banner" pageSession="Banners"></app-page-header>
<div class="min-h-screen bg-gray-50 p-6">
    <div class="max-w-6xl mx-auto">
      <!-- Banner Card -->
      <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
        <!-- Banner Image Section -->
        <div class="relative">
          <img 
            [src]="banner.imageUrl" 
            [alt]="banner.title"
            class="w-full h-96 object-cover"
          >
          
          <!-- Action Buttons Overlay -->
          <div class="absolute top-4 right-4 flex items-center gap-3">
            <button 
              mat-icon-button 
              class="bg-white bg-opacity-20 text-white hover:bg-opacity-30 backdrop-blur-sm"
              (click)="onDelete()"
            >
              <mat-icon>delete</mat-icon>
            </button>
            <button 
              mat-icon-button 
              class="bg-white bg-opacity-20 text-white hover:bg-opacity-30 backdrop-blur-sm"
              (click)="onEdit()"
            >
              <mat-icon>edit</mat-icon>
            </button>
            <mat-slide-toggle 
              [checked]="banner.isActive"
              (change)="onToggleStatus()"
              color="primary"
              class="banner-toggle"
            ></mat-slide-toggle>
          </div>
        </div>
  
        <!-- Banner Details Section -->
        <div class="p-8">
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
            <!-- Title -->
            <div>
              <h3 class="text-sm font-semibold text-gray-500 mb-2">Título</h3>
              <p class="text-gray-900 font-medium">{{ banner.title }}</p>
            </div>
  
            <!-- Target Audience -->
            <div>
              <h3 class="text-sm font-semibold text-gray-500 mb-2">Para quem</h3>
              <p class="text-gray-900">{{ banner.targetAudience }}</p>
            </div>
  
            <!-- Start Date -->
            <div>
              <h3 class="text-sm font-semibold text-gray-500 mb-2">Data inicial</h3>
              <p class="text-gray-900">{{ banner.startDate }}</p>
            </div>
  
            <!-- End Date -->
            <div>
              <h3 class="text-sm font-semibold text-gray-500 mb-2">Data</h3>
              <p class="text-gray-900">{{ banner.endDate }}</p>
            </div>
  
            <!-- Link -->
            <div>
              <h3 class="text-sm font-semibold text-gray-500 mb-2">Link</h3>
              <a 
                [href]="'https://' + banner.link" 
                target="_blank"
                class="text-blue-600 hover:text-blue-800 underline"
              >
                {{ banner.link }}
              </a>
            </div>
  
            <!-- Location -->
            <div class="md:col-span-3">
              <h3 class="text-sm font-semibold text-gray-500 mb-2">Localização</h3>
              <p class="text-gray-900">{{ banner.location }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
