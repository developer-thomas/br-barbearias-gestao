<div>
    <h2 class="text-xl font-semibold text-gray-900 mb-8">Dados do banner</h2>
    
    <form [formGroup]="form" class="space-y-6">
      <!-- Title and Dates Row -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Title -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Título</label>
          <mat-form-field appearance="outline" class="w-full">
            <input matInput formControlName="title" placeholder="Exemplo preenchido">
          </mat-form-field>
        </div>
  
        <!-- Start Date -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Data inicial</label>
          <mat-form-field appearance="outline" class="w-full">
            <input matInput formControlName="startDate" placeholder="00/00/00" mask="00/00/00">
          </mat-form-field>
        </div>
  
        <!-- End Date -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Data final</label>
          <mat-form-field appearance="outline" class="w-full">
            <input matInput formControlName="endDate" placeholder="00/00/00" mask="00/00/00">
          </mat-form-field>
        </div>
      </div>
  
      <!-- Link and Target Audience Row -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Link -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Link</label>
          <mat-form-field appearance="outline" class="w-full">
            <input matInput formControlName="link" placeholder="Exemplo preenchido">
          </mat-form-field>
        </div>
  
        <!-- Target Audience -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Para quem</label>
          <mat-form-field appearance="outline" class="w-full">
            <mat-select formControlName="targetAudience">
              <mat-option *ngFor="let option of targetAudienceOptions" [value]="option.value">
                {{ option.label }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
  
      <!-- Location Section -->
      <div class="space-y-4">
        <h3 class="text-lg font-semibold text-gray-900">Localização</h3>
        
        <!-- Location Search -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Selecione a</label>
          <div class="flex gap-3 items-start">
            <mat-form-field appearance="outline" class="flex-1">
              <input 
                matInput 
                formControlName="selectedLocation"
                placeholder="Bahia, Salvador, Filial"
                (keydown)="onLocationSelected($event)"
                [matAutocomplete]="regionAutocomplete"
              >
              <mat-autocomplete
                #regionAutocomplete="matAutocomplete"
                (optionSelected)="onRegionOptionSelected($event.option.value)"
              >
                <mat-option *ngIf="isLoadingRegions" class="text-gray-500" disabled>
                  Carregando regiões...
                </mat-option>
                <mat-option
                  *ngFor="let option of (filteredRegions$ | async) ?? []"
                  [value]="option"
                >
                  {{ option }}
                </mat-option>
              </mat-autocomplete>
            </mat-form-field>
            <button 
              type="button"
              class="h-[56px] px-6 border-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-50"
              (click)="addLocation()"
            >
              Adicionar
            </button>
          </div>
        </div>
  
        <!-- Location Cards -->     
           <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
             <div 
               *ngFor="let location of locations; let i = index" 
               class="flex items-center justify-between bg-gray-100 border border-gray-200 rounded-md px-4 py-3"
             >
               
               <span class="text-sm font-medium text-gray-700">{{ location }}</span>
               <button 
                 type="button" 
                 class="text-green-500 hover:text-red-500 w-6 h-6"
                 (click)="removeLocation(i)"
               >
                 <mat-icon class="text-lg">close</mat-icon>
               </button>
             </div>
           </div>
      </div>
    </form>
  </div>
