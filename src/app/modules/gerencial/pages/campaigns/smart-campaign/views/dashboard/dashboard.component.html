<div class="h-full">
  
  <!-- Dashboard Grid -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <!-- First 3 cards in top row -->
    <app-dashboard-card [data]="dashboardCards[0]"></app-dashboard-card>
    <app-dashboard-card [data]="dashboardCards[1]"></app-dashboard-card>
    <app-dashboard-card [data]="dashboardCards[2]"></app-dashboard-card>
  </div>

  <!-- Second row with chart and remaining cards -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
    <!-- Gráfico -->
    <div class="lg:col-span-2 bg-white rounded-2xl p-6 shadow-md border border-gray-200">
      <h3 class="text-lg font-semibold text-gray-900 mb-6">Clientes impactados por dia</h3>
      <div class="flex items-end justify-between h-64 gap-2 px-4">
        <div *ngFor="let item of chartData; trackBy: trackByIndex" class="flex flex-col items-center" style="flex: 1; min-width: 0;">
          <div class="flex-1 flex items-end mb-2 w-full">
            <div 
              class="w-full bg-gray-800 rounded-t-sm transition-all duration-300"
              [style.height.px]="(item.value / maxValue) * 200"
              [style.min-height.px]="20"
            >
            </div>
          </div>
          <div class="text-xs text-gray-600 text-center whitespace-nowrap">
            <div>{{ item.day }}</div>
            <div>{{ item.date }}</div>
          </div>
        </div>
      </div>
      <div class="text-xs text-gray-500 mt-2 px-4">0000</div>
    </div>

    <!-- Card Percentual de Impacto -->
    <div>
      <div class="bg-white rounded-2xl p-6 shadow-md border border-gray-200">
        <div class="mb-4">
          <h3 class="text-lg font-semibold text-gray-900 mb-2">Percentual de impacto</h3>
          <p class="text-xs text-gray-500 leading-relaxed">
            Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
          </p>
        </div>
        <div class="flex items-center justify-center">
          <div class="relative w-24 h-24">
            <svg class="w-24 h-24 transform -rotate-90" viewBox="0 0 36 36">
              <path
                class="text-gray-200"
                stroke="currentColor"
                stroke-width="3"
                fill="none"
                d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
              />
              <path
                class="text-green-500"
                stroke="currentColor"
                stroke-width="3"
                fill="none"
                stroke-dasharray="50, 100"
                d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
              />
            </svg>
            <div class="absolute inset-0 flex items-center justify-center">
              <span class="text-2xl font-bold text-gray-900">50%</span>
            </div>
          </div>
        </div>
      </div>
            
      <!-- Last card -->
      <div class="mt-5">
        <app-dashboard-card [data]="dashboardCards[6]"></app-dashboard-card>
      </div>
    </div>
  </div>
</div>
