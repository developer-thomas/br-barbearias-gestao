<div class="space-y-8" [formGroup]="form">
  <!-- Period Section -->
  <div class="bg-white rounded-xl p-6 border border-gray-200">
    <h3 class="text-lg font-semibold text-gray-900 mb-6">Período</h3>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Date Field -->
      <div>
        <label for="initialDate" class="block text-sm font-medium text-gray-700 mb-2">
          Data Início
        </label>
        <mat-form-field appearance="outline" class="w-full">
          <input 
            matInput 
            id="initialDate"
            formControlName="initialDate"
            placeholder="00/00/00"
            class="text-sm"
            mask="00/00/00"
          >
        </mat-form-field>
      </div>

      <!-- Time Field -->
      <div>
        <label for="validity" class="block text-sm font-medium text-gray-700 mb-2">
          Validade
        </label>
        <mat-form-field appearance="outline" class="w-full">
          <input 
            matInput 
            id="validity"
            formControlName="validity"
            placeholder="00/00/00"
            class="text-sm"
            mask="00/00/00"
          >
        </mat-form-field>
      </div>
    </div>
  </div>

  <!-- Product Section -->
  <div class="bg-white rounded-xl p-6 border border-gray-200">
    <h3 class="text-lg font-semibold text-gray-900 mb-6">Pontuação</h3>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Date Field -->
      <div>
        <label for="date" class="block text-sm font-medium text-gray-700 mb-2">
          Tipo
        </label>
        <mat-form-field appearance="outline" class="w-full">
          <mat-select formControlName="pointsType" id="pointsType" placeholder="Selecione um tempo">
            <mat-option *ngFor="let option of pointsTypeOptions" [value]="option.value">
              {{ option.title }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- Time Field -->
      <div>
        <label for="time" class="block text-sm font-medium text-gray-700 mb-2">
          Valor
        </label>
        <mat-form-field appearance="outline" class="w-full">
          <input 
            matInput 
            id="pointsValue"
            formControlName="pointsValue"
            class="text-sm"
          >
        </mat-form-field>
      </div>
    </div>
  </div>
</div>
