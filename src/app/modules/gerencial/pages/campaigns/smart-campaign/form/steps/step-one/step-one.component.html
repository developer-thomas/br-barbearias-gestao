<div>
  <h2 class="text-xl font-semibold text-gray-900 mb-8">Detalhes da campanha</h2>
  
  <form [formGroup]="form" class="space-y-6">
    <!-- Title Field -->
    <div class="grid grid-cols-1 md:grid-cols-3 space-x-4">
      <!-- Nome da campanha -->
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
          Nome da Campanha
        </label>
        <mat-form-field appearance="outline" class="w-full">
          <input 
            matInput 
            id="name"
            formControlName="name"
            class="text-sm"
          >
        </mat-form-field>
      </div>

      <!-- Tempo de envio -->
      <div>
        <label for="timeToSend" class="block text-sm font-medium text-gray-700 mb-2">
          Tempo de envio
        </label>
      
        <mat-form-field appearance="outline" class="w-full">
          <mat-select formControlName="timeToSend" id="timeToSend">
            <mat-option *ngFor="let option of timeToSendOptions" [value]="option.value">
              {{ option.title }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- Configuração -->
      <div>
        <label for="settings" class="block text-sm font-medium text-gray-700 mb-2">
          Configuração
        </label>
        <mat-form-field appearance="outline" class="w-full">
          <mat-select formControlName="settings" id="settings">
            <mat-option *ngFor="let option of settingsOptions" [value]="option.value">
              {{ option.title }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>

    <!-- Description Field -->
    <div>
      <label for="introduction" class="block text-sm font-medium text-gray-700 mb-2">
        Introdução
      </label>
      <mat-form-field appearance="outline" class="w-full">
        <textarea 
          matInput 
          id="introduction"
          formControlName="introduction"
          placeholder="Placeholder text"
          rows="6"
          class="text-sm resize-none"
        ></textarea>
      </mat-form-field>
    </div>
  </form>
</div>
