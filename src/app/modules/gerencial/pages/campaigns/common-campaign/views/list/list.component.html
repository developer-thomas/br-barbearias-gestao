<app-page-header pageSession="Campanhas Comuns" title="Campanhas" />

<section class="space-y-6">
  <app-multiple-filter-table 
    [filters]="filters"
    [viewMode]="viewMode"
    (viewModeChange)="onViewModeChange($event)"
    (filterChange)="onFilterChange($event)"
  >
    <button 
      mat-raised-button 
      color="primary" 
      class="bg-green-500 hover:bg-green-600 text-white font-medium px-6 h-11 rounded-md"
      (click)="gotoCreatePage()"
    >
      CADASTRAR
    </button>
  </app-multiple-filter-table>

  <ng-container *ngIf="isLoading(); else campaignsContent">
    <div class="rounded-xl bg-white shadow-sm p-6 text-center text-gray-500">
      Carregando campanhas...
    </div>
  </ng-container>

  <ng-template #campaignsContent>
    <ng-container *ngIf="errorMessage(); else campaignsView">
      <div class="rounded-xl bg-white shadow-sm p-6 text-center text-red-500">
        {{ errorMessage() }}
      </div>
    </ng-container>

    <ng-template #campaignsView>
      <div *ngIf="viewMode === 'list'">
        <app-commom-table
          [data]="data()"
          [displayedColumns]="displayedColumns"
          [length]="totalItems()"
          [pageIndex]="pageIndex()"
          [pageSize]="pageSize()"
          (pageChange)="onPageChange($event)"
          (detail)="gotoDetailPage($event)"
          (edit)="gotoEditPage($event)"
          (delete)="deleteRow($event)"
        ></app-commom-table>
      </div>

      <div *ngIf="viewMode === 'dashboard'" class="bg-white rounded-xl p-8 shadow-sm text-center">
        <app-dashboard></app-dashboard>
      </div>
    </ng-template>
  </ng-template>
</section>
