<div [formGroup]="form">
  <h2 class="text-xl font-semibold text-gray-900 mb-8">Recuperação</h2>
  
  <div class="space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Quantity Days -->
      <div class="flex flex-col space-y-2">
        <label for="quantityDays">Quantidade de dias</label>
        <mat-form-field appearance="outline" class="md:col-span-1">
          <mat-label>Quantidade de dias</mat-label>
          <input matInput formControlName="quantityDays" placeholder="Placeholder text">
        </mat-form-field>
      </div>

      <div class="flex flex-col space-y-2"> 
        <label for="settings">Configuração</label>
        <mat-form-field appearance="outline">
          <mat-label>Configuração</mat-label>
          <mat-select formControlName="settings">
            <mat-option value="fidelized-barber">Barbearia fidelizada</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- Franquiado -->
      <div class="flex flex-col space-y-2">
        <label for="franchised">Franquiado</label>
        <mat-form-field appearance="outline">
          <mat-label>Franquiado</mat-label>
          <mat-select formControlName="franchised">
            <mat-option value="Todos">Todos</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>

    <div class="space-y-2">
      <label for="selectedClient">Selecione os clientes específicos</label>
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Selecione os clientes específicos</mat-label>
        <input 
          matInput 
          formControlName="selectedClient" 
          placeholder="Dropdown item"
          (keydown)="onClientSelected($event)"
        >
        <button mat-icon-button matSuffix (click)="addClient()">
          <mat-icon class="text-green-500">search</mat-icon>
        </button>
      </mat-form-field>
    </div>

    <div *ngIf="clients.length > 0" class="flex flex-wrap gap-3">
      <div *ngFor="let client of clients; let i = index" class="flex items-center bg-gray-100 border border-gray-200 rounded-md px-3 py-2">
        <div>
          <p class="text-sm font-medium text-gray-800">{{ client.name }}</p>
        </div>
        <button mat-icon-button (click)="removeClient(i)" class="ml-2 text-green-500">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>

    <div class="space-y-2">
      <label for="description">Mensagem</label>
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Mensagem</mat-label>
        <textarea matInput formControlName="message" placeholder="Placeholder text" rows="5" class="resize-none"></textarea>
      </mat-form-field>
    </div>
  </div>
</div>
