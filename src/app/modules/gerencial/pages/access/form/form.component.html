<app-page-header [title]="isEditMode ? 'Editar acesso' : 'Novo acesso'" pageSession="Acessos"></app-page-header>

<div>
    <div>
      <div class="bg-white rounded-2xl shadow-sm p-8">
        @if (isLoadingDetail) {
          <div class="min-h-[200px] flex flex-col items-center justify-center text-gray-500 gap-2">
            <mat-icon>hourglass_top</mat-icon>
            <p>Carregando dados do acesso...</p>
          </div>
        } @else {
  <form [formGroup]="form" class="space-y-8" (ngSubmit)="onSubmit()">
          <!-- User Data Section -->
          <div>
            <h2 class="text-xl font-semibold text-gray-900 mb-6">Dados do usuário</h2>
            
            <div class="flex gap-8">
              <!-- Form Fields -->
              <div class="flex-1 space-y-6">
                <!-- Name and CPF Row -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Nome completo</label>
                    <mat-form-field appearance="outline" class="w-full">
                      <input matInput formControlName="fullName" placeholder="Exemplo preenchido">
                    </mat-form-field>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">CPF</label>
                    <mat-form-field appearance="outline" class="w-full">
                      <input matInput formControlName="cpf" placeholder="000.000.000-00" mask="000.000.000-00">
                    </mat-form-field>
                  </div>
                </div>
  
                <!-- Email and Password Row -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <mat-form-field appearance="outline" class="w-full">
                      <input matInput formControlName="email" placeholder="email@email.com" type="email">
                    </mat-form-field>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Senha</label>
                    <mat-form-field appearance="outline" class="w-full">
                      <input 
                        matInput 
                        formControlName="password" 
                        [type]="showPassword ? 'text' : 'password'"
                        placeholder="••••••••"
                      >
                      <button 
                        type="button"
                        mat-icon-button 
                        matSuffix 
                        (click)="togglePasswordVisibility()"
                        class="text-green-500"
                      >
                        <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                      </button>
                    </mat-form-field>
                  </div>
                </div>
              </div>
  
              <!-- Profile Image Upload -->
              <div class="w-48">
                <div 
                  class="w-full h-48 border-2 border-dashed border-gray-300 rounded-lg flex flex-col items-center justify-center cursor-pointer hover:border-green-500 hover:bg-gray-50 transition-all relative"
                  [class.pointer-events-none]="isEditMode || isLoadingDetail"
                  [class.opacity-70]="isEditMode || isLoadingDetail"
                  (click)="!form.get('profileImage')?.value && triggerFileInput(fileInput)"
                >
                  <input type="file" class="hidden" #fileInput (change)="onFileSelected($event)" accept="image/*">
                  
                  <!-- Placeholder -->
                  <div *ngIf="!form.get('profileImage')?.value" class="text-center text-gray-400">
                    <div class="w-16 h-16 bg-gray-200 rounded-full flex items-center justify-center mb-3 mx-auto">
                      <mat-icon class="text-2xl">person</mat-icon>
                    </div>
                    <div class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center mb-2 mx-auto">
                      <mat-icon class="text-white text-sm">photo_camera</mat-icon>
                    </div>
                    <p class="text-sm font-medium text-gray-700">Adicione uma foto</p>
                  </div>
  
                  <!-- Image Preview -->
                  <div *ngIf="form.get('profileImage')?.value" class="relative w-full h-full">
                    <img 
                      [src]="form.get('profileImage')?.value" 
                      alt="Preview da foto do usuário"
                      class="w-full h-full object-cover rounded-lg"
                    >
                    <button 
                      type="button"
                      class="absolute top-2 right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center hover:bg-red-600 text-xs"
                      (click)="removeImage()"
                    >
                      ×
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
  
          <!-- Permissions Section -->
          <div>
            <h2 class="text-xl font-semibold text-gray-900 mb-6">Permissão</h2>
            
            <!-- Access Type -->
            <div class="mb-8">
              <label class="block text-sm font-medium text-gray-700 mb-2">Tipo de acesso</label>
              <mat-form-field appearance="outline" class="w-full max-w-xs">
                <mat-select formControlName="accessType" [disabled]="isSubmitting || isLoadingDetail">
                  <mat-option *ngFor="let option of accessTypeOptions" [value]="option.value">
                    {{ option.label }}
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </div>
  
            <!-- Modules Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div 
                *ngFor="let module of modules; let i = index" 
                class="flex items-center justify-between p-4 border border-gray-200 rounded-lg"
              >
                <span class="text-sm font-medium text-gray-700">{{ module.name }}</span>
                <mat-checkbox 
                  [checked]="module.enabled"
                  (change)="onModuleChange(module.id, $event.checked)"
                  color="primary"
                  class="custom-checkbox"
                  [disabled]="isSubmitting || isLoadingDetail"
                ></mat-checkbox>
              </div>
            </div>
          </div>
  
          <!-- Action Buttons -->
          <div class="flex items-center justify-end gap-4 pt-6">
            <button 
              type="button"
              class="px-8 py-3 border-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-50"
              (click)="onCancel()"
            >
              CANCELAR
            </button>
            <button 
              type="submit"
              class="px-8 py-3 bg-green-500 hover:bg-green-600 text-white font-medium rounded-lg disabled:opacity-70 disabled:cursor-not-allowed"
              [disabled]="isSubmitting || isLoadingDetail"
            >
              {{ isSubmitting ? 'SALVANDO...' : (isEditMode ? 'SALVAR' : 'CONTINUAR') }}
            </button>
          </div>
        </form>
        }
      </div>
    </div>
  </div>
