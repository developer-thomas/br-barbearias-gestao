<app-page-header title="Detalhes do acesso" pageSession="Acessos"></app-page-header>
<div class="p-6">
    <div class="space-y-6">
      <!-- User Information Card -->
      <div class="bg-white rounded-2xl shadow-sm p-8">
        <div class="flex items-center justify-between">
          <!-- User Info -->
          <div class="flex items-center gap-8">
            <!-- Profile Image -->
            <div class="w-20 h-20 rounded-full overflow-hidden bg-gray-200 flex-shrink-0">
              <img 
                [src]="user.profileImage" 
                [alt]="user.name"
                class="w-full h-full object-cover"
              >
            </div>
  
            <!-- User Details -->
            <div class="grid grid-cols-3 gap-12">
              <!-- Name -->
              <div>
                <h3 class="text-sm font-semibold text-gray-500 mb-1">Nome</h3>
                <p class="text-gray-900 font-medium">{{ user.name }}</p>
              </div>
  
              <!-- CPF -->
              <div>
                <h3 class="text-sm font-semibold text-gray-500 mb-1">CPF</h3>
                <p class="text-gray-900">{{ user.cpf }}</p>
              </div>
  
              <!-- Email -->
              <div>
                <h3 class="text-sm font-semibold text-gray-500 mb-1">Email</h3>
                <p class="text-gray-900">{{ user.email }}</p>
              </div>
            </div>
          </div>
  
          <!-- Action Buttons -->
          <div class="flex items-center gap-3">
            <button 
              mat-icon-button 
              class="text-gray-500 hover:text-gray-700"
              (click)="onEdit()"
            >
              <mat-icon>edit</mat-icon>
            </button>
            <mat-slide-toggle 
              [checked]="user.isActive"
              (change)="onToggleStatus()"
              color="primary"
              class="user-toggle"
            ></mat-slide-toggle>
          </div>
        </div>
      </div>
  
      <!-- Permissions Card -->
      <div class="bg-white rounded-2xl shadow-sm p-8">
        <h2 class="text-xl font-semibold text-gray-900 mb-8">Permissão</h2>
        
        <!-- Access Type -->
        <div class="mb-8">
          <label class="block text-sm font-medium text-gray-700 mb-2">Tipo de acesso</label>
          <mat-form-field appearance="outline" class="w-full max-w-xs">
            <mat-select 
              [value]="user.accessType"
              (selectionChange)="onAccessTypeChange($event.value)"
              disabled
            >
              <mat-option *ngFor="let option of accessTypeOptions" [value]="option.value">
                {{ option.label }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
  
        <!-- Modules Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div 
            *ngFor="let module of user.modules; let i = index" 
            class="flex items-center justify-between p-4 border border-gray-200 rounded-lg"
          >
            <span class="text-sm font-medium text-gray-700">{{ module.name }}</span>
            <mat-checkbox 
              [checked]="module.enabled"
              (change)="onModuleChange(module.id, $event.checked)"
              color="primary"
              class="custom-checkbox"
              disabled
            ></mat-checkbox>
          </div>
        </div>
      </div>
    </div>
  </div>
