<app-page-header pageSession="Acessos" title="Acessos"></app-page-header>

<app-filter-table
    (filter)="onFilter($event)"
>
    <app-base-button
        label="Cadastrar"
        styleClass="green"
        routerLink="form"
    />
</app-filter-table>

@if (isLoading()) {
    <div class="rounded-xl bg-white shadow-md p-6 text-center text-gray-500 mt-4">
        Carregando lista de acessos...
    </div>
} @else {
    @if (errorMessage()) {
        <div class="rounded-xl bg-white shadow-md p-6 text-center text-red-500 mt-4">
            {{ errorMessage() }}
        </div>
    } @else {
        <app-commom-table
            [data]="data()"
            [displayedColumns]="displayedColumns"
            (detail)="gotoDetailPage($event)"
            (edit)="gotoEditPage($event)"
            (delete)="deleteRow($event)"
        />
    }
}
