<app-page-header [title]="title" [pageSession]="pageSession" />

<section>
  @if (isLoading()) {
    <div class="rounded-xl bg-white shadow-md p-6 text-center text-gray-500">
      Carregando dados do cliente...
    </div>
  } @else {
    @if (client(); as clientData) {
      <div class="rounded-xl bg-white shadow-md p-6">
        <mat-card-content>
          <div class="text-right">
            <mat-slide-toggle
              color="primary"
              [checked]="clientData.active"
              [disabled]="isUpdatingStatus()"
              (change)="changeStatus($event.checked)"
            />
          </div>
          <div class="grid md:grid-cols-[auto_1fr_1fr_1fr] gap-3">
            <div class="rounded-full h-24 w-24 overflow-hidden md:row-span-2 bg-gray-100">
              <img class="h-full w-full object-cover" [src]="clientData.avatar" alt="Avatar do cliente" />
            </div>
            <app-label-and-info label="Nome" [info]="clientData.name"></app-label-and-info>
            <app-label-and-info label="Documento" [info]="clientData.document"></app-label-and-info>
            <app-label-and-info label="Status" [info]="clientData.active | booleanStatus"></app-label-and-info>
            <app-label-and-info label="Email" [info]="clientData.email"></app-label-and-info>
            <app-label-and-info label="Telefone" [info]="clientData.phone"></app-label-and-info>
            <app-label-and-info label="Data de nascimento" [info]="clientData.birthDate"></app-label-and-info>
            <app-label-and-info label="Gênero" [info]="clientData.gender"></app-label-and-info>
          </div>
        </mat-card-content>
      </div>

      <div class="rounded-xl bg-white shadow-md p-6 mt-6">
        <h1 class="mb-5 font-bold text-lg">Últimas Avaliações</h1>
        <app-commom-table
          [data]="lastReviews()"
          [displayedColumns]="displayedColumns"
        />
      </div>
    } @else {
      <div class="rounded-xl bg-white shadow-md p-6 text-center text-gray-500">
        {{ errorMessage() ?? 'Cliente não encontrado.' }}
      </div>
    }
  }
</section>
