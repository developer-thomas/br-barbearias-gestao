<div>
    <h2 class="text-xl font-semibold text-gray-900 mb-8">Imagem</h2>
    
    <form [formGroup]="form">
      <!-- Image Upload Section -->
      <div 
        class="relative w-full h-80 border-2 border-dashed border-gray-300 rounded-lg flex items-center justify-center cursor-pointer hover:border-green-500 hover:bg-gray-50 transition-all"
        (click)="!form.get('imageUrl')?.value && triggerFileInput(fileInput)"
      >
        <input type="file" class="hidden" #fileInput (change)="onFileSelected($event)" accept="image/*">
        
        <!-- Placeholder -->
        <div *ngIf="!form.get('imageUrl')?.value" class="text-center text-gray-500">
          <div class="text-6xl mb-4 font-light">+</div>
          <p class="text-lg text-gray-700">Adicione uma segunda mensagem</p>
        </div>
  
        <!-- Image Preview -->
        <div *ngIf="form.get('imageUrl')?.value" class="relative w-full h-full">
          <img 
            [src]="form.get('imageUrl')?.value" 
            alt="Preview da imagem do produto"
            class="w-full h-full object-contain rounded-lg p-4"
          >
          <button 
            type="button"
            class="absolute top-4 right-4 bg-red-500 text-white rounded-full w-8 h-8 flex items-center justify-center hover:bg-red-600 text-sm font-bold"
            (click)="removeImage()"
          >
            ×
          </button>
        </div>
      </div>
  
      <!-- Upload Instructions -->
      <div class="mt-4 text-center text-sm text-gray-500">
        <p>Recomendamos imagens com resolução mínima de 800x600 pixels</p>
        <p>Tamanho máximo: 5MB</p>
      </div>
    </form>
  </div>
