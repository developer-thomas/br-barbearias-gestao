<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav py-7" fixedInViewport
      [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
      [mode]="(isHandset$ | async) ? 'over' : 'side'"
      [opened]="(isHandset$ | async) === false">
    
    <!-- Logo Section -->
    <div class="logo-section">
      <img src="assets/images/logo.svg" alt="BR Barbearia" class="logo">
    </div>

    <!-- Navigation Menu -->
    <div class="nav-menu">
      @for (item of routes; track $index) {
        @if (item.children && item.children.length > 0) {
          <!-- Expandable Menu Item -->
          <mat-expansion-panel class="expansion-panel" [hideToggle]="false">
            <mat-expansion-panel-header class="expansion-header">
              <mat-panel-title class="panel-title">
                <div class="sidenav-item__link flex justify-start items-center gap-3">
                  <mat-icon class="menu-icon">{{ item.icon }}</mat-icon>
                  <span class="menu-label">{{ item.label }}</span>
                </div>
              </mat-panel-title>
            </mat-expansion-panel-header>
            
            <div class="submenu-content">
              @for (child of item.children; track $index) {
                <a mat-list-item routerLinkActive="active" class="submenu-item" [routerLink]="child.route">
                  <div class="submenu-item__link flex justify-start items-center gap-3">
                    <span class="submenu-label">{{ child.label }}</span>
                  </div>
                </a>
              }
            </div>
          </mat-expansion-panel>
        } @else {
          <!-- Regular Menu Item -->
          <a mat-list-item routerLinkActive="active" class="sidenav-item" [routerLink]="item.route">
            <div class="sidenav-item__link flex justify-start items-center gap-3">
              <mat-icon class="menu-icon">{{ item.icon }}</mat-icon>
              <span class="menu-label">{{ item.label }}</span>
            </div>
          </a>
        }
      }
    </div>

    <!-- Logout Button -->
    <div class="logout-section">
      <button mat-list-item class="logout-btn" (click)="logout()">
        <div class="sidenav-item__link flex justify-start items-center gap-3">
          <mat-icon class="menu-icon">exit_to_app</mat-icon>
          <span class="menu-label">Sair</span>
        </div>
      </button>
    </div>

  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" *ngIf="isHandset$ | async">
      <button
        type="button"
        aria-label="Toggle sidenav"
        mat-icon-button
        (click)="drawer.toggle()"
      >
        <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
      </button>
    </mat-toolbar>
    <main class="p-5">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
